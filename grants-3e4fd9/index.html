const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));return new TextDecoder().decode(pt)}
function show(h){document.getElementById('app').innerHTML='<header><span class="dot"></span><h1>OVJ · 오버미디어아트 지원사업·공고 선별</h1></header>'+h;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,section').forEach(e=>e.classList.remove('on'));
b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')})}
document.getElementById('g').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
try{const h=await open_(pw);if(document.getElementById('rm').checked){try{localStorage.setItem(K,pw)}catch(_){}}show(h)}
catch(_){document.getElementById('e').textContent='비밀번호가 맞지 않습니다'}};
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){}if(s){try{show(await open_(s))}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
